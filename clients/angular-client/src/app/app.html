<div class="app">
  <div class="container">
    <header class="header">
      <h1>Angular Client</h1>
      <p>Clean Architecture con RxJS + Standalone Components</p>
      <div class="framework-badge">🔥 Angular Fire Theme</div>
    </header>

    @if (message) {
      <div [class]="'message ' + (message.includes('✓') || message.includes('Bienvenido') ? 'success' : 'error')" data-testid="message">
        {{ message }}
      </div>
    }

    @if (!isAuthenticated) {
      <app-login-form (loginSubmit)="onLogin($event)"></app-login-form>
    } @else {
      <div class="toolbar">
        <button
          class="btn btn-secondary"
          (click)="loadProducts()"
          [disabled]="loading"
          data-testid="reload-button"
        >
          🔄 Recargar Productos
        </button>
        <button
          class="btn btn-danger"
          (click)="onLogout()"
          data-testid="logout-button"
        >
          🚪 Cerrar Sesión
        </button>
      </div>

      <div class="card">
        <app-product-form (productSubmit)="onProductSubmit($event)"></app-product-form>
      </div>

      <app-product-list
        [products]="products"
        [loading]="loading"
        (deleteProduct)="onProductDelete($event)"
      ></app-product-list>
    }
  </div>
</div>
