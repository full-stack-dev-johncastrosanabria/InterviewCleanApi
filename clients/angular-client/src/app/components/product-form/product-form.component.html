<form class="product-form" (ngSubmit)="onSubmit()" data-testid="product-form">
  <h2>Crear Producto</h2>

  <div class="form-row">
    <div class="form-group">
      <label for="name">Nombre *</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="Nombre del producto"
        required
        [disabled]="loading"
        data-testid="product-name-input"
      />
    </div>

    <div class="form-group">
      <label for="description">Descripción</label>
      <input
        id="description"
        type="text"
        [(ngModel)]="description"
        name="description"
        placeholder="Descripción opcional"
        [disabled]="loading"
        data-testid="product-description-input"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="price">Precio *</label>
      <input
        id="price"
        type="number"
        step="0.01"
        min="0"
        [(ngModel)]="price"
        name="price"
        placeholder="0.00"
        required
        [disabled]="loading"
        data-testid="product-price-input"
      />
    </div>

    <div class="form-group">
      <label for="stock">Stock *</label>
      <input
        id="stock"
        type="number"
        min="0"
        [(ngModel)]="stock"
        name="stock"
        placeholder="0"
        required
        [disabled]="loading"
        data-testid="product-stock-input"
      />
    </div>
  </div>

  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="loading"
    data-testid="create-product-button"
  >
    {{ loading ? 'Creando...' : 'Crear Producto' }}
  </button>
</form>
