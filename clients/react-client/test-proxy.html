<!DOCTYPE html>
<html>
<head>
    <title>Proxy Test</title>
</head>
<body>
    <h1>Vite Proxy Test</h1>
    <button onclick="testProxy()">Test /api/products</button>
    <button onclick="testLogin()">Test /api/auth/login</button>
    <pre id="result"></pre>

    <script>
        async function testProxy() {
            const result = document.getElementById('result');
            try {
                result.textContent = 'Testing /api/products...\n';
                const response = await fetch('/api/products');
                result.textContent += `Status: ${response.status}\n`;
                result.textContent += `Headers: ${JSON.stringify([...response.headers], null, 2)}\n`;
                const text = await response.text();
                result.textContent += `Body: ${text}\n`;
            } catch (error) {
                result.textContent += `Error: ${error.message}\n`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('result');
            try {
                result.textContent = 'Testing /api/auth/login...\n';
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'john@test.com',
                        password: '123456'
                    })
                });
                result.textContent += `Status: ${response.status}\n`;
                result.textContent += `Headers: ${JSON.stringify([...response.headers], null, 2)}\n`;
                const text = await response.text();
                result.textContent += `Body: ${text}\n`;
            } catch (error) {
                result.textContent += `Error: ${error.message}\n`;
            }
        }
    </script>
</body>
</html>
